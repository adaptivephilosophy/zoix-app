name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Choose simulator
        id: sim
        run: python3 scripts/select-simulator.py

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Zoix.xcodeproj \
            -scheme Zoix \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/ZoixTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zoix-test-results
          path: ${{ runner.temp }}/ZoixTests.xcresult
          if-no-files-found: ignore
